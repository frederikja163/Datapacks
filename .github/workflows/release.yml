name: Release Datapacks

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.detect.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed datapacks
        id: detect
        run: |
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"

          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "${before}^{commit}" >/dev/null 2>&1; then
            changed="$(git show --pretty=format: --name-only "$sha")"
          else
            changed="$(git diff --name-only "$before" "$sha")"
          fi

          packs=()
          for meta in */pack.mcmeta; do
            dir="${meta%%/*}"
            if printf '%s\n' "$changed" | grep -q "^${dir}/"; then
              packs+=("$dir")
            fi
          done

          if [ ${#packs[@]} -eq 0 ]; then
            json="[]"
          else
            json="$(printf '%s\n' "${packs[@]}" | jq -R . | jq -cs .)"
          fi

          echo "packs=$json" >> "$GITHUB_OUTPUT"
          echo "Changed datapacks: $json"

  release:
    needs: detect
    if: needs.detect.outputs.packs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pack: ${{ fromJSON(needs.detect.outputs.packs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Package datapack
        run: |
          set -euo pipefail
          pack="${{ matrix.pack }}"

          if grep -rIlq -e '\${' -e '\$<' -e '\$\[' "$pack" --exclude-dir=.git; then
            args=()
            if [ -d "$pack/globals" ]; then
              args+=(-m "$pack/globals")
            fi
            rm -rf build
            dotnet FileCompiler/FileCompiler.dll "$pack" "${args[@]}" -o "build/$pack"
            rm -rf "build/$pack/globals"
            (cd "build/$pack" && zip -r "${GITHUB_WORKSPACE}/${pack}.zip" .)
          else
            (cd "$pack" && zip -r "${GITHUB_WORKSPACE}/${pack}.zip" .)
          fi

          ls -l "${pack}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pack="${{ matrix.pack }}"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          tag="${pack}-${short}"

          notes="$(git log -1 --pretty=format:'%h %s' "$sha")"

          gh release create "$tag" "${pack}.zip" \
            --title "${pack} ${short}" \
            --notes "$notes"
