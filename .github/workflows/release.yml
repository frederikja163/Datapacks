name: Release Datapacks

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.detect.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed datapacks
        id: detect
        run: |
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"

          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "${before}^{commit}" >/dev/null 2>&1; then
            changed="$(git show --pretty=format: --name-only "$sha")"
          else
            changed="$(git diff --name-only "$before" "$sha")"
          fi

          packs=()

          # TypeScript packs live under packs/<name>/src and share mcgen/
          shared=0
          if printf '%s\n' "$changed" | grep -qE '^(mcgen|scripts)/|^(package\.json|tsconfig\.json|bun\.lock)$'; then
            shared=1
          fi
          for dir in packs/*/; do
            name="$(basename "$dir")"
            # only releasable packs: they must have a version file
            if [ ! -f "packs/${name}/VERSION" ]; then
              continue
            fi
            if [ "$shared" = 1 ] || printf '%s\n' "$changed" | grep -q "^packs/${name}/"; then
              packs+=("$name")
            fi
          done

          if [ ${#packs[@]} -eq 0 ]; then
            json="[]"
          else
            json="$(printf '%s\n' "${packs[@]}" | jq -R . | jq -cs .)"
          fi

          echo "packs=$json" >> "$GITHUB_OUTPUT"
          echo "Changed datapacks: $json"

  release:
    needs: detect
    if: needs.detect.outputs.packs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pack: ${{ fromJSON(needs.detect.outputs.packs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release version
        id: version
        run: |
          set -euo pipefail
          pack="${{ matrix.pack }}"

          file="packs/${pack}/VERSION"
          if [ ! -f "$file" ]; then
            echo "Missing version file: $file" >&2
            exit 1
          fi

          base="$(tr -d '[:space:]' < "$file")"
          if ! printf '%s' "$base" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$base' in $file (expected MAJOR.MINOR)" >&2
            exit 1
          fi

          patches="$(git tag -l "${pack}-${base}.*" | wc -l | tr -d ' ')"
          version="${base}.${patches}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing ${pack} ${version}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build datapack
        run: |
          set -euo pipefail
          pack="${{ matrix.pack }}"

          bun install --frozen-lockfile
          bun run build "$pack"
          (cd "packs/${pack}/build/${pack}" && zip -r "${GITHUB_WORKSPACE}/${pack}.zip" .)

          ls -l "${pack}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pack="${{ matrix.pack }}"
          version="${{ steps.version.outputs.version }}"
          sha="${{ github.sha }}"
          tag="${pack}-${version}"

          notes="$(git log -1 --pretty=format:'%h %s' "$sha")"

          gh release create "$tag" "${pack}.zip" \
            --title "${pack} ${version}" \
            --notes "$notes"
